<mat-toolbar class="custom-toolbar">
  
  <button 
    mat-icon-button 
    aria-label="Open"
    [disabled]="false"
    (click)="onOpen()">
    <img src="icons/open.png" alt="Open" class="toolbar-icon" />
  </button>

  <button 
    mat-icon-button 
    aria-label="Record"
    [disabled]="false"
    (click)="onRecord()">
    <span [class.icon-line-wrapper]="isRecording">
      <img src="icons/record.png" alt="Record" class="toolbar-icon" />
    </span>
    
  </button>
</mat-toolbar>
